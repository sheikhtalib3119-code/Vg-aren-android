name: Build VG Aren AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract VG Aren project
        run: |
          unzip -q VGAren_Android_Project.zip -d .
          cd VGArenAndroid
          echo "Project extracted:"
          ls -la

      - name: Build release AAB
        working-directory: VGArenAndroid
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VG-Aren-AAB
          path: VGArenAndroid/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
